<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 영수증 교환소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e8ea;--panel:#f3f4f5;--text:#1b1d1f;--muted:#62686e;--line:#bfc5ca;--accent:#d7261e;--on-accent:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--panel:#1d1f21;--text:#ecedee;--muted:#9aa0a6;--line:#3a3f44;--accent:#e5453b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141516;--panel:#1d1f21;--text:#ecedee;--muted:#9aa0a6;--line:#3a3f44;--accent:#e5453b;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:32px 20px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:32px;align-items:start}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--text);font:inherit;text-decoration:underline;cursor:pointer;padding:4px 0}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.row:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.row b{display:block;font-size:14px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.row span{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.go{margin-top:16px;width:100%;padding:14px;border:0;border-radius:6px;background:var(--accent);color:var(--on-accent);font:700 16px "Noto Sans KR",sans-serif;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.empty{border:1px dashed var(--line);border-radius:6px;padding:48px 24px;text-align:center;color:var(--muted)}
.rc{margin-bottom:28px}
.rc img{display:block;width:100%;height:auto;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.save{display:block;margin-top:14px;text-align:center;padding:13px;border:2px solid var(--text);border-radius:6px;color:var(--text);text-decoration:none;font-weight:700}
.hint{color:var(--muted);font-size:13px;text-align:center;margin:-8px 0 20px}
@media (max-width:780px){main{grid-template-columns:1fr}}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:24px}
.sum .lab{color:var(--muted);font-size:14px}
.sum .amt{font-size:34px;font-weight:700;line-height:1.25;margin:2px 0 4px}
.sum .meta{color:var(--muted);font-size:13px}
.sum ul{list-style:none;margin:14px 0 0;padding:0;border-top:1px dashed var(--line)}
.sum li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.sum li:last-child{border-bottom:0;padding-bottom:0}
.sum .top{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.sum .tname{font-size:20px;font-weight:700;line-height:1.45;margin:2px 0}
</style>
</head>
<body>
<main>
  <section>
    <h1>2026 영수증 교환소</h1>
    <p class="sub">다녀온 공연을 고르면 영수증을 발급해드립니다.</p>
    <div class="tools"><span id="count">0개 선택</span><button class="link" id="all" type="button">전체 선택</button></div>
    <div class="list" id="list"></div>
    <button class="go" id="go" type="button" disabled>영수증 발행</button>
  </section>
  <section aria-live="polite">
    <div class="empty" id="empty">공연을 고르고<br>영수증 발행을 눌러주세요.</div>
    <div id="result" hidden>
      <div class="sum" id="sum"></div>
      <p class="hint">영수증 이미지를 꾹 눌러서 저장하세요. (PC는 우클릭)</p>
      <div id="results"></div>
    </div>
  </section>
</main>
<script>
const CONCERTS = [{"no": "26012301", "date": "26.01.23", "title": "SHIFT", "to": "Club OnAir", "songs": "약속의 땅|Fighter|-|도둑들|언니|-|잔디|-|꽃|-|Lighthouse|해일|모래알"}, {"no": "26031502", "date": "26.03.15", "title": "JS아트홀 1주년 기념", "to": "JS ART HALL", "songs": "약속의 땅|Fighter|-|언니|도둑들|-|해일"}, {"no": "26032703", "date": "26.03.27", "title": "2026 통영 프린지", "to": "통영 프린지", "songs": "하루방|-|언니|-|Surfer’s high|-|도둑들"}, {"no": "26042604", "date": "26.04.26", "title": "[TRAIL.](단독)", "to": "톤 스튜디오", "songs": "개미|BRTX|불균형|-|하루방|잔디|-|Confidence game|Bloody mary|-|Pond scum|배수|해파리|-|꽃|Skit|Intro|약속의 땅|도둑들|Fighter|-|키위|-|언니|-|Lighthouse|-|해일|+|눈, 빛|모래알|이방인"}, {"no": "26051005", "date": "26.05.10", "title": "FF", "to": "Club FF", "songs": "해파리|언니|-|도둑들|Fighter|-|약속의 땅|-|키위|-|Lighthouse|-|눈, 빛|-|해일|모래알"}, {"no": "26051706", "date": "26.05.17", "title": "JS아트홀", "to": "JS ART HALL", "songs": "이방인|개미|-|하루방|잔디|-|언니|-|Lighthouse|-|해일|-|모래알"}, {"no": "26052207", "date": "26.05.22", "title": "스페이스한강", "to": "스페이스 한강", "songs": "Intro|하루방|꽃|-|Pond scum|배수|-|언니|-|Lighthouse"}, {"no": "26052908", "date": "26.05.29", "title": "언플러그드라운지", "to": "언플러그드 라운지", "songs": "하루방|잔디|-|도둑들|Fighter|-|키위|약속의 땅|-|언니|-|Lighthouse|-|모래알|-|해일|-|눈, 빛"}, {"no": "26060509", "date": "26.06.05", "title": "펫사운즈", "to": "PETSOUNDS", "songs": "하루방|꽃|-|Pond scum|배수|-|Surfer’s high|-|도둑들|Fighter|-|약속의 땅|-|언니|-|모래알"}, {"no": "26071210", "date": "26.07.12", "title": "극락", "to": "모래내 극락", "songs": "배수|Surfer’s high|-|하루방|잔디|-|도둑들|불균형|-|약속의 땅|-|언니|-|해일|-|모래알|이방인|+|눈, 빛"}, {"no": "26080211", "date": "26.08.02", "title": "FF", "to": "Club FF", "songs": "하루방|잔디|-|도둑들|Fighter|-|약속의 땅|-|키위|-|언니|-|모래알"}, {"no": "26081512", "date": "26.08.15", "title": "프리버드", "to": "Club Freebird", "songs": "배수|Surfer’s high|-|해파리|-|Lighthouse|-|언니|-|눈, 빛"}, {"no": "26091313", "date": "26.09.13", "title": "The Lullabite vol.2", "to": "Club Freebird", "songs": "도둑들|불균형|-|Fighter|약속의 땅|-|키위|-|눈, 빛"}, {"no": "26091814", "date": "26.09.18", "title": "Freefall", "to": "Azito hall", "songs": "개미|이방인|-|꽃|해일|-|Lighthouse|-|모래알"}, {"no": "26092015", "date": "26.09.20", "title": "밴드시그널", "to": "석촌호수 아뜰리에", "songs": "개미|-|잔디|-|배수|해파리|-|도둑들|Fighter|-|약속의 땅|-|키위|-|언니|-|Lighthouse|-|모래알|+|눈, 빛|해일"}, {"no": "26100316", "date": "26.10.03", "title": "부산 국제 록 페스티벌", "to": "히든스테이지", "songs": "도둑들|Fighter|약속의 땅|-|눈, 빛|-|언니|모래알|-|해일"}, {"no": "26100817", "date": "26.10.08", "title": "FIREWORKS vol.1", "to": "Rolling hall", "songs": "모래알|-|꽃|-|키위|하루방|-|눈, 빛|도둑들|-|언니|-|Lighthouse|-|개미"}, {"no": "26101018", "date": "26.10.10", "title": "인천시민의날 축제", "to": "인천대공원", "songs": "꽃|-|배수|-|언니|-|모래알"}, {"no": "26101819", "date": "26.10.18", "title": "Triple Crown", "to": "Club Freebird", "songs": "하루방|해파리|꽃|-|Fighter|약속의 땅|-|Surfer’s high|눈, 빛|-|언니|-|Lighthouse|모래알|해일|+|이방인"}, {"no": "26111420", "date": "26.11.14", "title": "은평 인디스테이지", "to": "은평 인디스테이션", "songs": "배수|Pond scum|해파리|-|Lighthouse|-|해일|-|모래알|이방인|+|두더지"}, {"no": "26112321", "date": "26.11.23", "title": "Otherwise with Mondayproject", "to": "우무지", "songs": "언니|불균형|키위|Fighter|-|약속의 땅|도둑들|-|해파리|Pond scum|배수|-|잔디|하루방|-|눈, 빛|Lighthouse|-|꽃|해일|-|개미|+|모래알|이방인"}];
const $ = id => document.getElementById(id);
const list = $("list"), go = $("go");
const songCount = r => r.songs.split("|").filter(s => s !== "-" && s !== "+").length;
CONCERTS.forEach(r => {
  const row = document.createElement("label");
  row.className = "row";
  row.innerHTML = `<input type="checkbox"><div><b></b><span></span></div>`;
  row.querySelector("input").value = r.no;
  row.querySelector("b").textContent = r.title;
  row.querySelector("span").textContent = `${r.date} / ${r.to}`;
  list.appendChild(row);
});
const boxes = () => [...list.querySelectorAll("input")];
function sync(){
  const k = boxes().filter(b => b.checked).length;
  $("count").textContent = `${k}개 선택`;
  go.disabled = k === 0;
  $("all").textContent = k === boxes().length ? "전체 해제" : "전체 선택";
}
list.addEventListener("change", sync);
$("all").onclick = () => { const on = boxes().some(b => !b.checked); boxes().forEach(b => b.checked = on); sync(); };
function render(){
  const ids = boxes().filter(b => b.checked).map(b => b.value);
  const sel = CONCERTS.filter(r => ids.includes(r.no));
  if (!sel.length) return;
  const box = $("results"); box.textContent = "";
  const EXCL = new Set(["intro", "skit"]);
  const cnt = new Map();
  sel.forEach(r => r.songs.split("|").forEach(t => {
    if (t === "-" || t === "+") return;
    const name = t.trim(), key = name.toLowerCase();
    if (EXCL.has(key)) return;
    if (!cnt.has(key)) cnt.set(key, { name, n: 0 });
    cnt.get(key).n++;
  }));
  const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
  const sm = $("sum"); sm.textContent = "";
  sm.append(mk("div", "lab", "함께 들은 곡"), mk("div", "amt", `${cnt.size}곡`), mk("div", "meta", `공연 ${sel.length}회 / 같은 곡은 한 번만 세어요`));
  const maxN = Math.max(0, ...[...cnt.values()].map(v => v.n));
  if (maxN > 1) {
    const tops = [...cnt.values()].filter(v => v.n === maxN).map(v => v.name);
    const shown = tops.slice(0, 3).join(", ") + (tops.length > 3 ? ` 외 ${tops.length - 3}곡` : "");
    const top = mk("div", "top");
    top.append(mk("div", "lab", "가장 많이 들은 곡"), mk("div", "tname", shown), mk("div", "meta", `${maxN}번 들었어요`));
    sm.appendChild(top);
  }
  sel.forEach(r => {
    const src = `${r.no}.jpg`;
    const wrap = document.createElement("div"); wrap.className = "rc";
    const img = document.createElement("img"); img.src = src; img.loading = "lazy"; img.alt = `${r.date} ${r.title} 영수증`;
    wrap.append(img); box.appendChild(wrap);
  });
  $("empty").hidden = true; $("result").hidden = false;
  if (matchMedia("(max-width:780px)").matches) $("result").scrollIntoView({ behavior: "smooth" });
}
go.onclick = render;
sync();
</script>
</body>
</html>
