<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 영수증 교환소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000000;--ink:#f7b731;--mute:rgba(247,183,49,.64);--line:rgba(247,183,49,.4);--on-ink:#000000;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:32px 20px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:32px;align-items:start}
h1{font:400 40px/1.15 "Do Hyeon","Noto Sans KR",sans-serif;margin:6px 0 10px;transform:rotate(-2deg);transform-origin:left bottom}
.sub{color:var(--mute);margin:0 0 22px;font-size:14px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mute);font-size:14px}
.link{background:none;border:0;color:var(--ink);font:inherit;text-decoration:underline;cursor:pointer;padding:4px 0}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:10px;background:var(--bg);border:1px solid var(--line);cursor:pointer}
.row:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.row input{width:20px;height:20px;margin:0;accent-color:var(--ink);flex:none}
.row:has(input:checked) input{accent-color:var(--on-ink)}
.row b{display:block;font-size:14px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.row span{display:block;color:var(--mute);font-size:12px;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.row:has(input:checked) span{color:rgba(0,0,0,.72)}
.go{margin-top:16px;width:100%;padding:12px;border:0;background:var(--ink);color:var(--on-ink);font:400 24px "Do Hyeon","Noto Sans KR",sans-serif;cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.empty{border:1px dashed var(--line);padding:48px 24px;text-align:center;color:var(--mute)}
.sum{border:1px solid var(--line);margin-bottom:22px}
.sec{border-bottom:1px solid var(--line)}
.bar{background:var(--ink);color:var(--on-ink);font-size:12px;font-weight:700;padding:3px 12px}
.val{padding:10px 12px 14px}
.big{font:400 42px/1.15 "Do Hyeon","Noto Sans KR",sans-serif}
.name{font:400 26px/1.4 "Do Hyeon","Noto Sans KR",sans-serif}
.meta{color:var(--mute);font-size:13px}
.miss{font-size:15px;line-height:1.7;margin-top:6px}
.sum summary{cursor:pointer;background:var(--ink);color:var(--on-ink);font-weight:700;padding:11px 12px;list-style:none;display:flex;justify-content:space-between}
.sum summary::-webkit-details-marker{display:none}
.sum summary::after{content:"+"}
.sum details[open] summary::after{content:"-"}
.rk{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:18px;line-height:1.5}
.rk i{font-style:normal;font-weight:700;min-width:2.4em}
.rk span{flex:1;min-width:0;word-break:keep-all}
.rk em{font-style:normal;color:var(--mute);font-size:14px;white-space:nowrap}
.thx{padding:14px 12px}
.thx .l1{font:400 28px/1.4 "Do Hyeon","Noto Sans KR",sans-serif;word-break:keep-all}
.thx .l2{margin-top:4px;color:var(--mute);font-size:14px;word-break:keep-all}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:-8px 0 20px}
.rc{margin-bottom:28px}
.rc img{display:block;width:100%;height:auto}
@media (max-width:780px){main{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>
<body>
<main>
  <section>
    <h1>2026 영수증 교환소</h1>
    <p class="sub">방문해주신 공연의 영수증을 발급해드립니다.</p>
    <div class="tools"><span id="count">0개 선택</span><button class="link" id="all" type="button">전체 선택</button></div>
    <div class="list" id="list"></div>
    <button class="go" id="go" type="button" disabled>영수증 발행</button>
  </section>
  <section aria-live="polite">
    <div class="empty" id="empty">공연을 고르고<br>영수증 발행을 눌러주세요.</div>
    <div id="result" hidden>
      <div class="sum" id="sum"></div>
      <p class="hint">영수증 이미지를 꾹 눌러서 저장하세요. (PC는 우클릭)</p>
      <div id="results"></div>
    </div>
  </section>
</main>
<script>
const CONCERTS = [{"no": "26012301", "date": "26.01.23", "title": "SHIFT", "to": "클럽 온에어", "songs": "약속의 땅|Fighter|-|도둑들|언니|-|잔디|-|꽃|-|Lighthouse|해일|모래알", "total": 44000, "min": 40}, {"no": "26031502", "date": "26.03.15", "title": "JS ROCK FEST", "to": "JS아트홀", "songs": "약속의 땅|Fighter|-|언니|도둑들|-|해일", "total": 40000, "min": 20}, {"no": "26032703", "date": "26.03.27", "title": "2026 통영 프린지", "to": "통영 강구안 해상무대", "songs": "하루방|-|언니|-|Surfer’s high|-|도둑들", "total": 0, "min": 20}, {"no": "26042604", "date": "26.04.26", "title": "TRAIL.", "to": "톤 스튜디오", "songs": "개미|BRTX|불균형|-|하루방|잔디|-|Confidence game|Bloody mary|-|Pond scum|배수|해파리|-|꽃|Skit|Intro|약속의 땅|도둑들|Fighter|-|키위|-|언니|-|Lighthouse|-|해일|+|눈, 빛|모래알|이방인", "total": 44000, "min": 100}, {"no": "26051005", "date": "26.05.10", "title": "Delete Ya", "to": "Club FF", "songs": "해파리|언니|-|도둑들|Fighter|-|약속의 땅|-|키위|-|Lighthouse|-|눈, 빛|-|해일|모래알", "total": 30000, "min": 40}, {"no": "26051706", "date": "26.05.17", "title": "Sweet and Happy Sunday Show", "to": "JS아트홀", "songs": "이방인|개미|-|하루방|잔디|-|언니|-|Lighthouse|-|해일|-|모래알", "total": 40000, "min": 30}, {"no": "26052207", "date": "26.05.22", "title": "Use Once and Destroy", "to": "스페이스한강", "songs": "Intro|하루방|꽃|-|Pond scum|배수|-|언니|-|Lighthouse", "total": 33000, "min": 30}, {"no": "26052908", "date": "26.05.29", "title": "On the way", "to": "언플러그드라운지", "songs": "하루방|잔디|-|도둑들|Fighter|-|키위|약속의 땅|-|언니|-|Lighthouse|-|모래알|-|해일|-|눈, 빛", "total": 25000, "min": 45}, {"no": "26060509", "date": "26.06.05", "title": "Petsounds indie live", "to": "펫사운즈", "songs": "하루방|꽃|-|Pond scum|배수|-|Surfer’s high|-|도둑들|Fighter|-|약속의 땅|-|언니|-|모래알", "total": 0, "min": 50}, {"no": "26071210", "date": "26.07.12", "title": "모래내 그루브", "to": "모래내 극락", "songs": "배수|Surfer’s high|-|하루방|잔디|-|도둑들|불균형|-|약속의 땅|-|언니|-|해일|-|모래알|이방인|+|눈, 빛", "total": 40000, "min": 50}, {"no": "26080211", "date": "26.08.02", "title": "Who’s your boyfriend", "to": "Club FF", "songs": "하루방|잔디|-|도둑들|Fighter|-|약속의 땅|-|키위|-|언니|-|모래알", "total": 30000, "min": 40}, {"no": "26081512", "date": "26.08.15", "title": "Surfer’s High", "to": "프리버드", "songs": "배수|Surfer’s high|-|해파리|-|Lighthouse|-|언니|-|눈, 빛", "total": 35000, "min": 30}, {"no": "26091313", "date": "26.09.13", "title": "The LULLABITE VOL.2", "to": "프리버드", "songs": "도둑들|불균형|-|Fighter|약속의 땅|-|키위|-|눈, 빛", "total": 25000, "min": 30}, {"no": "26091814", "date": "26.09.18", "title": "Freefall", "to": "아지토 라이브홀", "songs": "개미|이방인|-|꽃|해일|-|Lighthouse|-|모래알", "total": 30000, "min": 30}, {"no": "26092015", "date": "26.09.20", "title": "밴드시그널", "to": "석촌호수 아뜰리에", "songs": "개미|-|잔디|-|배수|해파리|-|도둑들|Fighter|-|약속의 땅|-|키위|-|언니|-|Lighthouse|-|모래알|+|눈, 빛|해일", "total": 0, "min": 60}, {"no": "26100316", "date": "26.10.03", "title": "부산국제록페스티벌 hidden stage", "to": "삼락생태공원", "songs": "도둑들|Fighter|약속의 땅|-|눈, 빛|-|언니|모래알|-|해일", "total": 0, "min": 30}, {"no": "26100817", "date": "26.10.08", "title": "FIREWORKS vol.1", "to": "롤링홀", "songs": "모래알|-|꽃|-|키위|하루방|-|눈, 빛|도둑들|-|언니|-|Lighthouse|-|개미", "total": 0, "min": 40}, {"no": "26101018", "date": "26.10.10", "title": "인천 제62회 시민의날 기념 인천시민대축제", "to": "인천대공원 어울큰마당", "songs": "꽃|-|배수|-|언니|-|모래알", "total": 0, "min": 20}, {"no": "26101819", "date": "26.10.18", "title": "Triple Crown", "to": "프리버드", "songs": "하루방|해파리|꽃|-|Fighter|약속의 땅|-|Surfer’s high|눈, 빛|-|언니|-|Lighthouse|모래알|해일|+|이방인", "total": 35000, "min": 50}, {"no": "26111420", "date": "26.11.14", "title": "INDIE STAGE", "to": "은평 인디스테이션", "songs": "배수|Pond scum|해파리|-|Lighthouse|-|해일|-|모래알|이방인|+|두더지", "total": 0, "min": 40}, {"no": "26112321", "date": "26.11.23", "title": "Otherwise (Monday project)", "to": "우무지", "songs": "언니|불균형|키위|Fighter|-|약속의 땅|도둑들|-|해파리|Pond scum|배수|-|잔디|하루방|-|눈, 빛|Lighthouse|-|꽃|해일|-|개미|+|모래알|이방인", "total": 44000, "min": 100}];
const MASTER = ["배수","모래알","해일","서퍼스하이","도둑들","컨피던스게임","블러디메리","이방인","폰드스컴","언니","잔디","약속의땅","불균형","라이트하우스","해파리","하루방","꽃","두더지","파이터","개미","BRTX","키위","눈,빛"];
const norm = t => t.toLowerCase().replace(/[\s,’']/g, "");
const CANON = new Map(MASTER.map(n => [norm(n), n]));
Object.entries({ surfershigh: "서퍼스하이", confidencegame: "컨피던스게임", bloodymary: "블러디메리", pondscum: "폰드스컴", lighthouse: "라이트하우스", fighter: "파이터" }).forEach(([k, v]) => CANON.set(k, v));
const $ = id => document.getElementById(id);
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const list = $("list"), go = $("go");
CONCERTS.forEach(r => {
  const row = document.createElement("label");
  row.className = "row";
  row.innerHTML = `<input type="checkbox"><div><b></b><span></span></div>`;
  row.querySelector("input").value = r.no;
  row.querySelector("b").textContent = r.title;
  row.querySelector("span").textContent = `${r.date} / ${r.to}`;
  list.appendChild(row);
});
const boxes = () => [...list.querySelectorAll("input")];
function sync(){
  const k = boxes().filter(b => b.checked).length;
  $("count").textContent = `${k}개 선택`;
  go.disabled = k === 0;
  $("all").textContent = k === boxes().length ? "전체 해제" : "전체 선택";
}
const refresh = () => {
  sync();
  if ($("result").hidden) return;
  if (boxes().some(b => b.checked)) render(false);
  else { $("result").hidden = true; $("empty").hidden = false; }
};
list.addEventListener("change", refresh);
$("all").onclick = () => { const on = boxes().some(b => !b.checked); boxes().forEach(b => b.checked = on); refresh(); };
function render(scroll = true){
  const ids = boxes().filter(b => b.checked).map(b => b.value);
  const sel = CONCERTS.filter(r => ids.includes(r.no));
  if (!sel.length) return;
  const box = $("results"); box.textContent = "";
  const cnt = new Map(MASTER.map(n => [n, 0]));
  sel.forEach(r => {
    const seen = new Set();
    r.songs.split("|").forEach(t => { if (t === "-" || t === "+") return; const n = CANON.get(norm(t)); if (n) seen.add(n); });
    seen.forEach(n => cnt.set(n, cnt.get(n) + 1));
  });
  const heard = MASTER.filter(n => cnt.get(n) > 0), missed = MASTER.filter(n => cnt.get(n) === 0);
  const maxN = Math.max(0, ...cnt.values());
  const sec = (label, ...kids) => { const s = mk("div", "sec"), v = mk("div", "val"); v.append(...kids); s.append(mk("div", "bar", label), v); return s; };
  const sm = $("sum"); sm.textContent = "";
  sm.append(sec("함께 들은 곡", mk("div", "big", `${heard.length}곡`), mk("div", "meta", `전체 ${MASTER.length}곡 중 / 공연 ${sel.length}회 (같은 곡은 한 번만 세어요)`)));
  if (maxN > 1) {
    const tops = MASTER.filter(n => cnt.get(n) === maxN);
    sm.append(sec("가장 많이 들은 곡", mk("div", "name", tops.join(", ")), mk("div", "meta", `${maxN}번 들었어요`)));
  } else {
    sm.append(sec("가장 많이 들은 곡", mk("div", "name", "모두 한 번씩 들었어요")));
  }
  sm.append(missed.length
    ? sec("못 들은 곡", mk("div", "big", `${missed.length}곡`), mk("div", "miss", missed.join(", ")))
    : sec("못 들은 곡", mk("div", "name", "모든 곡을 들으셨어요!")));
  const total = sel.reduce((t, r) => t + r.total, 0), mins = sel.reduce((t, r) => t + r.min, 0);
  const timeText = `${mins}분+α`;
  const d = mk("details"), thx = mk("div", "thx");
  thx.append(mk("div", "l1", `${total.toLocaleString("en-US")}원 ${timeText}`), mk("div", "l2", "귀한 응원의 발걸음 감사드립니다."));
  d.append(mk("summary", "", "더 알아보기"), thx);
  sm.append(d);
  sel.forEach(r => {
    const wrap = mk("div", "rc");
    const img = document.createElement("img"); img.src = `${r.no}.jpg`; img.loading = "lazy"; img.alt = `${r.date} ${r.title} 영수증`;
    wrap.append(img); box.appendChild(wrap);
  });
  $("empty").hidden = true; $("result").hidden = false;
  if (scroll && matchMedia("(max-width:780px)").matches) $("result").scrollIntoView({ behavior: "smooth" });
}
go.onclick = () => render();
sync();
</script>
</body>
</html>
